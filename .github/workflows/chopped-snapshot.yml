name: Chopped Player Pool Snapshot

on:
  schedule:
    - cron: '0 */3 * * *'   # every 3 hours
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Sleeper data and build snapshot
        run: node scripts/chopped-snapshot.js

      - name: Commit snapshot if changed
        run: |
          git config user.name "chopped-snapshot-bot"
          git config user.email "actions@github.com"
          git add data/chopped-pool.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Chopped player pool snapshot"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "Push rejected, rebasing onto latest main and retrying (attempt $i)..."
            git pull --rebase origin main
            sleep $((RANDOM % 5 + 1))
          done
          echo "Failed to push after retries" >&2
          exit 1
